<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Court</title>
    <link rel="stylesheet" href="./style.css">

    <link rel="shortcut icon" href="./assets/fabicon/scutty background.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caacupe+One&family=Oswald:wght@200..700&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <!-- header section -->
    <header>
        <nav class="navbar">
            <i class="fa-solid fa-bars bar" style="color: rgb(5, 4, 4);"></i>
            <h2>F <span class="part">OO</span>D COURT</h2>

            <div class="list-div">
                <ul class="list">
                    <li>Shop</li>
                    <li>Features</li>
                    <li>Recipes</li>
                    <li>Hotline</li>
                </ul>
            </div>

            <div class="profile">
                <i class="fa-solid fa-cart-shopping shoping" style="color: red"></i>

                <img src="./assets/profile/image.png" alt="img">
            </div>
        </nav>
    </header>
    <!-- here is my hero section -->
    <div class="hero-div">
        
        <!-- here is my hero left -->
        <div class="hero-left">
            <h1><span class="h-c">Herb-Infused </span>Chicken <br> Delight</h1>

            <p class="para-div">Herb-Infused Chicken Delight features tender grilled chicken drumsticks seasoned with
                fresh rosemary, served atop a
                vibrant mix of cherry tomatoes, cucumber slices, and greens for a flavorful and healthy meal.</p>


                <div class="btn-div">

                    <button class="order">Order Now</button>
                    <button class="dine">Dine-In</button>
                </div>


                <div class="images">
          <img src="./assets/food/image1.png" alt="img">
          <img src="./assets/food/image2.png" alt="img">
          <img src="./assets/food/image3.png" alt="img">
                </div>
        </div>

        <!-- here is my hero right -->
        <div class="hero-right">
            <img src="./assets/food/image5.png" alt="img">
                   
        </div>
    </div>
</body>

</html>
